plugins {
    id 'com.android.library'
}

android {
    namespace 'com.rknn.engine'
    compileSdk 34
    ndkVersion '26.1.10909125'

    defaultConfig {
        minSdk 24
        consumerProguardFiles 'consumer-rules.proguard-rules.pro'

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}
